  <text x="560" y="133" fill="#f4f7f8" font-family="'DM Mono', monospace" font-size="12">STATUS</text>
  <!-- Data row 1 -->
  <rect x="106" y="156" width="588" height="38" rx="4" fill="#e3eaed"/>
  <rect x="126" y="170" width="110" height="12" rx="2" fill="#586f7a"/>
