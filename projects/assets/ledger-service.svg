  <!-- Data row 2 -->
  <rect x="106" y="204" width="588" height="38" rx="4" fill="#f4f7f8" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="126" y="218" width="130" height="12" rx="2" fill="#586f7a"/>
  <rect x="310" y="218" width="70" height="12" rx="2" fill="#b0bec5"/>
